name: Daily Container Sync and Build

on:
  schedule:
    - cron: '23 3 * * *'  # Daily 03:23 UTC
  workflow_dispatch:      # allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  UPSTREAM: https://github.com/ai-dynamo/aiconfigurator.git

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write

    steps:
      - name: Checkout container branch
        uses: actions/checkout@v4
        with:
          ref: container
          fetch-depth: 0
          lfs: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream main and tags
        run: |
          git remote add upstream ${{ env.UPSTREAM }}
          git fetch upstream main --tags

      - name: Rebase container branch onto upstream main
        run: |
          git rebase upstream/main
          echo "Rebase succeeded — $(git rev-parse --short HEAD) on upstream/main $(git rev-parse --short upstream/main)"

      - name: Push rebased container branch
        run: git push origin container --force-with-lease

      - name: Push new upstream release tags to fork
        run: |
          for tag in $(git tag -l 'v*'); do
            if ! git ls-remote --exit-code origin "refs/tags/$tag" > /dev/null 2>&1; then
              echo "Pushing new tag: $tag"
              git push origin "$tag"
            fi
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=container
            type=sha,prefix=container-
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Container sync failed (run #${context.runNumber})`,
              body: [
                `**Workflow:** ${context.workflow}`,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `**Triggered by:** ${context.eventName}`,
              ].join('\n'),
              labels: ['ci-failure'],
            })
